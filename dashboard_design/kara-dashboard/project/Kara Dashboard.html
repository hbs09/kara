<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Kara — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="tokens.css"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="data.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="charts.jsx"></script>
  <script type="text/babel" src="overview.jsx"></script>
  <script type="text/babel" src="orders.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>

  <script type="text/babel">
    const App = () => {
      const [route, setRoute] = React.useState('overview');
      const [openOrder, setOpenOrder] = React.useState(null);
      const [openProduct, setOpenProduct] = React.useState(null);

      // ESC closes overlays
      React.useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'Escape') {
            if (openProduct) setOpenProduct(null);
            else if (openOrder) setOpenOrder(null);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [openOrder, openProduct]);

      const titles = {
        overview: { t: 'Overview', s: 'Live performance across the store' },
        orders: { t: 'Orders', s: 'Manage payments, fulfillment and returns' },
        products: { t: 'Products', s: 'Catalog, collections and variants' },
        inventory: { t: 'Inventory', s: 'Stock levels and reorder alerts' },
        customers: { t: 'Customers', s: 'Profiles, tiers and lifetime value' },
        analytics: { t: 'Analytics', s: '' },
        marketing: { t: 'Marketing', s: '' },
        settings: { t: 'Settings', s: '' },
      };

      const screen = (() => {
        switch (route) {
          case 'overview':  return <Overview onNavigate={setRoute} onOpenOrder={setOpenOrder} onOpenProduct={setOpenProduct}/>;
          case 'orders':    return <Orders onOpenOrder={setOpenOrder}/>;
          case 'products':  return <Products onOpenProduct={setOpenProduct}/>;
          case 'inventory': return <Inventory onOpenProduct={setOpenProduct}/>;
          case 'customers': return <Customers/>;
          case 'analytics': return <Stub title="Analytics"/>;
          case 'marketing': return <Stub title="Marketing"/>;
          case 'settings':  return <Stub title="Settings"/>;
          default:          return <Overview onNavigate={setRoute} onOpenOrder={setOpenOrder} onOpenProduct={setOpenProduct}/>;
        }
      })();

      return (
        <div data-screen-label={titles[route].t} style={{ display: 'flex', minHeight: '100vh', background: 'var(--surface)' }}>
          <Sidebar active={route} onNavigate={setRoute}/>
          <main style={{ flex: 1, minWidth: 0 }}>
            {screen}
          </main>
          {openOrder && <OrderPanel order={openOrder} onClose={() => setOpenOrder(null)}/>}
          {openProduct && <ProductModal product={openProduct} onClose={() => setOpenProduct(null)}/>}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
